name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run unittest
        run: python -m unittest discover tests -v
      - name: Syntax check
        run: |
          python -m py_compile src/noted/hub.py
          python -m py_compile src/noted/cli.py
          python -m py_compile tests/test_hub.py
      - name: Verify no hardcoded user paths in source
        run: |
          if grep -rE "(/Users/[^/]+|/home/[^/]+|/root|C:\\\\Users\\\\|/private/tmp)" src/ tests/ README.md .github/; then
            echo "ERROR: Hardcoded absolute user path found"
            exit 1
          fi